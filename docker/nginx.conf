server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Application Flutter Web (SPA) : tout retombe sur index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy vers le conteneur API : http://localhost:8080/api/...
    location ^~ /api/ {
        proxy_pass http://api:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache des assets Flutter (images, polices, canvaskit)
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Fichiers d'amorçage : jamais mis en cache, sinon un rebuild n'est pas vu
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /main.dart.js {
        add_header Cache-Control "no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /flutter_bootstrap.js {
        add_header Cache-Control "no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /flutter_service_worker.js {
        add_header Cache-Control "no-store, must-revalidate";
        try_files $uri =404;
    }
}
